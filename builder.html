<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROI.bot Prompt Builder</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <p class="brand" id="brand"></p>
    <img class="logo" src="images/roi-bot-logo.png" width="245" height="168" alt="ROI.bot">
  </div>
</div>

<div class="wrap">
  <nav class="progress" id="progress" aria-label="Progress">
    <ol class="steps-tabs" id="stepsTabs"></ol>
    <ol class="parts" id="parts"></ol>
  </nav>

  <header>
    <h1 id="title"></h1>
    <p id="intro"></p>
    <p><a id="howToLink" href="help.html"></a></p>
  </header>

  <div class="counter" id="counter" aria-live="polite"></div>
  <form id="screen" novalidate onsubmit="return false"></form>

  <!-- Version 2 plan: ← Previous on the left, Next (the only orange button) on the right. -->
  <div class="nav">
    <button type="button" class="btn ghost" id="back"></button>
    <button type="button" class="btn next" id="next"></button>
  </div>
  <p class="next-line" id="afterNext" hidden></p>
  <div class="nav-sub">
    <button type="button" class="btn quiet small" id="clear"></button>
  </div>
</div>

<script src="js/questions.js"></script>
<script src="js/sheet.js"></script>
<script src="js/zip-place.js"></script>
<script src="js/export.js"></script>
<script src="js/read-documents.js"></script>
<script src="js/quick.js"></script>
<script src="js/builder.js"></script>
</body>
</html>
