<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tell Your Story with Numbers</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Screen 1 of FAC's ROI.bot Version 2 build plan. The wording comes from js/questions.js (screen1). -->
<div class="topbar">
  <div class="topbar-in">
    <p class="brand" id="brand"></p>
    <img class="logo" src="images/roi-bot-logo.png" width="245" height="168" alt="ROI.bot">
  </div>
</div>

<div class="wrap narrow">
  <nav class="progress" id="progress" aria-label="Progress" data-step="0">
    <ol class="steps-tabs" id="stepsTabs"></ol>
    <ol class="parts" id="parts"></ol>
  </nav>

  <header>
    <h1 id="title"></h1>
    <p id="intro"></p>
  </header>

  <!-- Let's Get Started: two screens, both 1.1. Screen 1 is the organization; Screen 2 is who the member is. -->
  <form class="card" id="s1" novalidate>
    <div class="f">
      <label for="s1-org" id="s1-org-label"></label>
      <input type="text" id="s1-org" autocomplete="organization">
    </div>
    <div class="f">
      <label for="s1-website" id="s1-website-label"></label>
      <input type="url" id="s1-website" autocomplete="url">
    </div>
    <div class="f f-zip">
      <label for="s1-zip" id="s1-zip-label"></label>
      <input type="text" id="s1-zip" inputmode="numeric" maxlength="10" autocomplete="postal-code">
      <p class="hint zip-place" id="s1-zip-place" aria-live="polite"></p>
    </div>
    <div class="card-actions">
      <button type="submit" class="btn next" id="next1" disabled></button>
    </div>
  </form>

  <form class="card" id="s2" novalidate hidden>
    <div class="f">
      <label for="s2-name" id="s2-name-label"></label>
      <input type="text" id="s2-name" autocomplete="name">
    </div>
    <div class="f">
      <label for="s2-title" id="s2-title-label"></label>
      <input type="text" id="s2-title" autocomplete="organization-title">
    </div>
    <div class="f">
      <label for="s2-phone" id="s2-phone-label"></label>
      <input type="text" id="s2-phone" inputmode="tel" autocomplete="tel">
    </div>
    <div class="card-actions">
      <button type="button" class="btn ghost" id="prev2"></button>
      <button type="submit" class="btn next" id="next2" disabled></button>
    </div>
  </form>

  <p class="next-line" id="nextLine" hidden></p>
</div>

<script src="js/questions.js"></script>
<script src="js/zip-place.js"></script>
<script src="js/screen1.js"></script>
</body>
</html>
