<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How to Use</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- The wording comes from js/questions.js (howTo), like every other word members read. -->
<div class="topbar">
  <div class="topbar-in">
    <p class="brand" id="brand"></p>
    <!-- ROI.bot's logo goes here once FAC sends the file. -->
  </div>
</div>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <p id="intro"></p>
  </header>
  <div id="screen">
    <ol class="howto" id="steps"></ol>
    <p class="hint" id="privacy"></p>
    <p class="hint" id="zipCredit"></p>
  </div>
  <div id="whyNow" class="note-box">
    <h2 id="whyNowTitle"></h2>
    <p id="whyNowIntro"></p>
    <ul id="whyNowList"></ul>
    <p class="hint" id="whyNowSource"></p>
  </div>
  <div id="aiNote" class="note-box">
    <h2 id="aiNoteTitle"></h2>
  </div>
  <p><a id="back" href="builder.html"></a></p>
</div>

<script src="js/questions.js"></script>
<script>
(function () {
  var H = FAC_QUESTIONS.howTo;
  document.getElementById("brand").textContent = FAC_QUESTIONS.brand;
  document.getElementById("title").textContent = H.title;
  document.getElementById("intro").textContent = H.intro;
  document.getElementById("privacy").textContent = H.privacy;
  document.getElementById("back").textContent = H.back;
  var C = H.zipCredit, credit = document.getElementById("zipCredit"), a = document.createElement("a");
  a.href = C.url; a.textContent = C.linkText; a.target = "_blank"; a.rel = "noopener";
  credit.appendChild(document.createTextNode(C.before)); credit.appendChild(a); credit.appendChild(document.createTextNode(C.after));
  var list = document.getElementById("steps");
  H.steps.forEach(function (s) { var li = document.createElement("li"); li.textContent = s; list.appendChild(li); });
  ["whyNowTitle", "whyNowIntro", "whyNowSource", "aiNoteTitle"].forEach(function (k) { document.getElementById(k).textContent = H[k]; });
  H.whyNow.forEach(function (s) { var li = document.createElement("li"); li.textContent = s; document.getElementById("whyNowList").appendChild(li); });
  H.aiNote.forEach(function (s) { var p = document.createElement("p"); p.textContent = s; document.getElementById("aiNote").appendChild(p); });
})();
</script>
</body>
</html>
